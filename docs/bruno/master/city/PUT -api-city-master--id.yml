info:
  name: PUT /api/city-master/:id
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/city-master/{{id}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
      disabled: true
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "countryId": 1,
        "stateId": 1,
        "cityName": "DEWASH"
      }
  auth: inherit

runtime:
  variables:
    - name: id
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: POST /api/partner-app-master
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/partner-app-master"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "code": "HAFLE",
        "name": "Hafele",
        "adapterCode": "HAFLE",
        "defaultProductId": 1,
        "defaultPaymentType": "CREDIT",
        "customerIds": [1, 2],
        "extraConfig": { "SenderID": "SBEC", "ReceiverID": "HAFELE" },
        "webhook": {
          "webhookUrl": "https://partner.example.com/tracking",
          "authType": "BEARER",
          "authValue": "partner-token",
          "isActive": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true

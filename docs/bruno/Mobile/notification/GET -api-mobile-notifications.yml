info:
  name: GET /api/mobile/notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/mobile/notifications?page=1&limit=20&unreadOnly=true"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
      disabled: true
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: unreadOnly
      value: "true"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
